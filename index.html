<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE Business Setup</title>

<style>
body {margin:0; font-family:Arial; background:#f4f6f9;}

.hero {
background: url('https://images.unsplash.com/photo-1508057198894-247b23fe5ade') no-repeat center/cover;
color:white;
text-align:center;
padding:100px 20px;
}

.hero h1 {font-size:34px;}
.btn {
background:#00c853;
color:white;
padding:12px 20px;
border:none;
cursor:pointer;
margin-top:10px;
}

.section {padding:40px 20px; text-align:center;}

.packages {display:flex; flex-wrap:wrap; gap:15px; justify-content:center;}
.card {
background:white;
padding:20px;
border-radius:10px;
width:260px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.whatsapp {
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
font-size:20px;
text-decoration:none;
}

/* POPUP */
.popup {
display:none;
position:fixed;
top:0; left:0;
width:100%; height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}

.popup-content {
background:white;
padding:25px;
border-radius:10px;
width:90%;
max-width:350px;
text-align:center;
}

.popup input {
width:100%;
padding:10px;
margin:10px 0;
}

.close {
position:absolute;
top:15px;
right:20px;
cursor:pointer;
font-size:20px;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<h1>Start Your UAE Company Today</h1>
<p>0% Tax | 100% Ownership</p>
<button class="btn" onclick="openPopup()">Get Free Consultation</button>
</div>

<!-- PACKAGES -->
<div class="section">
<h2>Our Packages</h2>
<div class="packages">
<div class="card">Starter - AED 5,999</div>
<div class="card">Business - AED 9,999</div>
<div class="card">Premium - AED 14,999</div>
</div>
</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/971XXXXXXXXX">💬</a>

<!-- POPUP FORM -->
<div class="popup" id="popup">
<div class="popup-content">
<span class="close" onclick="closePopup()">✖</span>
<h3>Get Free Consultation</h3>

<form id="leadForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="tel" id="phone" placeholder="Phone Number" required>
<input type="email" id="email" placeholder="Email Address" required>
<button class="btn" type="submit">Submit</button>
</form>

</div>
</div>

<script>
// AUTO POPUP after 3 sec
setTimeout(() => {
document.getElementById("popup").style.display = "flex";
}, 3000);

function openPopup(){
document.getElementById("popup").style.display = "flex";
}

function closePopup(){
document.getElementById("popup").style.display = "none";
}

// FORM SUBMIT
document.getElementById("leadForm").addEventListener("submit", function(e){
e.preventDefault();

let data = {
name: document.getElementById("name").value,
phone: document.getElementById("phone").value,
email: document.getElementById("email").value
};

// 👇 GOOGLE SCRIPT URL yahan daalna
fetch("YOUR_GOOGLE_SCRIPT_URL", {
method:"POST",
body: JSON.stringify(data)
})
.then(res => {
alert("Submitted Successfully!");
document.getElementById("popup").style.display = "none";
});
});
</script>

</body>
</html>
