<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE Freezone Workspace | مساحة عمل المنطقة الحرة</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --uae-red: #FF0000;
  --uae-green: #00732F;
  --uae-black: #000000;
  --uae-white: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: #f4f7fa; color: #1a1a1a; line-height: 1.6; }

/* HEADER */
header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 50px; background: var(--uae-black);
    border-top: 5px solid var(--uae-red); color: white;
    position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.logo-container { display: flex; align-items: center; gap: 12px; }
.logo-container img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--uae-green); }
.logo-text strong { font-size: 18px; display: block; }
.arabic-text { font-family: 'Cairo', sans-serif; font-size: 13px; color: var(--uae-green); }

nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 600; font-size: 14px; }
nav a:hover { color: var(--uae-red); }

/* HERO */
.hero {
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
    url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=1600');
    background-size: cover; background-position: center;
    color: white; text-align: center; padding: 120px 20px;
}
.hero h1 { font-size: 45px; text-transform: uppercase; margin-bottom: 10px; }
.hero h2 { font-family: 'Cairo', sans-serif; color: var(--uae-green); margin-bottom: 20px; }

/* BUTTON */
.btn {
    background: var(--uae-green); color: white; padding: 15px 35px;
    border: none; border-radius: 50px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,115,47,0.3);
}
.btn:hover { background: var(--uae-red); transform: translateY(-3px); }

/* SECTIONS */
.section { padding: 80px 20px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
.card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s; }
.card:hover { transform: translateY(-10px); border-bottom: 5px solid var(--uae-green); }
.card img { width: 100%; height: 220px; object-fit: cover; }
.card h3 { padding: 20px 10px; }

/* MODAL / POPUP */
.modal {
    display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); align-items: center; justify-content: center;
}
.modal.show { display: flex; }
.modal-content {
    background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 500px;
    position: relative; border-top: 8px solid var(--uae-green);
}
.close-modal { position: absolute; top: 15px; right: 20px; font-size: 25px; cursor: pointer; }

input, select { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #ddd; border-radius: 8px; }

/* WHATSAPP */
.whatsapp {
    position: fixed; bottom: 30px; right: 30px; background: #25D366; color: white;
    width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 30px; text-decoration: none; z-index: 1000;
}
</style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="https://images.unsplash.com/photo-1523217582562-09d0def993a6?auto=format&fit=crop&w=100" alt="Logo">
        <div class="logo-text">
            <strong>UAE FREEZONE WORKSPACE</strong>
            <span class="arabic-text">مساحة عمل المنطقة الحرة</span>
        </div>
    </div>
    <nav>
        <a href="#">Home</a>
        <a href="#" class="open-modal">Contact Us</a>
    </nav>
</header>

<div class="hero">
    <h1>Launch Your UAE Business</h1>
    <h2 dir="rtl">ابدأ عملك في الإمارات</h2>
    <p>0% Tax | 100% Ownership | Quick Setup</p>
    <button class="btn open-modal">Get Free Consultation</button>
</div>

<div class="section">
    <h2>Our Services</h2>
    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=500" alt="License">
            <h3>Trade License</h3>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?auto=format&fit=crop&w=500" alt="Golden Visa">
            <h3>Golden Visa Services</h3>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1601597111158-2fceff292cdc?auto=format&fit=crop&w=500" alt="Bank">
            <h3>Bank Account Opening</h3>
        </div>
    </div>
</div>

<div class="modal" id="formModal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 style="margin-bottom:10px;">Free Consultation</h2>
        <p style="color:#666; margin-bottom:20px;">Details bhariye, hum aapko contact karenge.</p>
        
        <form action="https://formspree.io/f/xpqkjqep" method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="tel" name="phone" placeholder="Phone (with country code)" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <select name="service">
                <option value="Trade License">Trade License</option>
                <option value="Golden Visa">Golden Visa</option>
                <option value="Bank Account">Bank Account</option>
            </select>
            <button type="submit" class="btn" style="width: 100%;">Submit Now</button>
        </form>
    </div>
</div>

<a href="https://wa.me/971XXXXXXXXX" class="whatsapp">💬</a>

<script>
    const modal = document.getElementById('formModal');
    const openBtns = document.querySelectorAll('.open-modal');
    const closeBtn = document.querySelector('.close-modal');

    openBtns.forEach(btn => {
        btn.onclick = () => modal.classList.add('show');
    });

    closeBtn.onclick = () => modal.classList.remove('show');

    window.onclick = (event) => {
        if (event.target == modal) modal.classList.remove('show');
    }
</script>

</body>
</html>
