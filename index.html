<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE Free Zone Workspace</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f7fb;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#0f172a;
color:white;
position:sticky;
top:0;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:40px;
height:40px;
border-radius:50%;
}

nav a{
color:white;
margin:0 10px;
text-decoration:none;
}

/* HERO */
.hero{
background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1524492449090-1d2b5a6a5a0c?auto=format&fit=crop&w=1400&q=80');
background-size:cover;
background-position:center;
color:white;
text-align:center;
padding:120px 20px;
}

.hero h1{font-size:40px;}
.hero p{font-size:18px;}

/* BUTTON */
.btn{
background:#00c853;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:15px;
}

/* SECTION */
.section{
padding:60px 20px;
text-align:center;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1100px;
margin:auto;
}

/* CARD */
.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
display:block;
}

/* FORM */
.form-box{
background:white;
padding:25px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ddd;
border-radius:6px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
font-size:22px;
text-decoration:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

<div class="logo">
<img src="https://images.unsplash.com/photo-1524492449090-1d2b5a6a5a0c?auto=format&fit=crop&w=100&q=80">
<strong>UAE Workspace</strong>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>

</header>

<!-- HERO -->
<div class="hero">
<h1>UAE Free Zone Workspace</h1>
<p>0% Tax | Full Ownership | Fast Setup</p>
<button class="btn">Get Free Consultation</button>
</div>

<!-- FEATURES -->
<div class="section">
<h2>Why UAE?</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=800&q=80">
<h3>0% Tax</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=800&q=80">
<h3>Ownership</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7?auto=format&fit=crop&w=800&q=80">
<h3>Fast Setup</h3>
</div>

</div>
</div>

<!-- SERVICES -->
<div class="section">
<h2>Services</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=800&q=80">
<h3>Freezone License</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1588776814546-ec7e8a1d4a09?auto=format&fit=crop&w=800&q=80">
<h3>Visa Services</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1565514158740-064f34bd6f66?auto=format&fit=crop&w=800&q=80">
<h3>Bank Setup</h3>
</div>

</div>
</div>

<!-- FORM -->
<div class="section">
<h2>Get Consultation</h2>

<div class="form-box">
<input type="text" placeholder="Name">
<input type="tel" placeholder="Phone">
<input type="email" placeholder="Email">
<button class="btn">Submit</button>
</div>

</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/971XXXXXXXXX">💬</a>

</body>
</html>
